<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cooling Priority Index · Abuja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--ink:#14252b;--mute:#5b6d72;--line:#d9e1e0;--bg:#eef2f1;--accent:#a9272c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 "Schibsted Grotesk",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
#app{display:grid;grid-template-columns:minmax(0,1fr) 460px;height:100%}
#mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0}
aside{overflow-y:auto;background:#fff;border-left:1px solid var(--line);padding:24px 24px 40px}
h1{font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:0 0 8px}
h2{font-size:15px;margin:0 0 2px}
aside p{margin:0;color:var(--mute)}
section{border-top:1px solid var(--line);margin-top:22px;padding-top:18px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1.3fr;margin-top:20px}
.kpis div{padding:0 12px;border-left:1px solid var(--line)}
.kpis div:first-child{padding-left:0;border:0}
.kpis b{display:block;font-size:26px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpis span{color:var(--mute);font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.row label{flex:1 1 140px;display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:4px}
select,input,button{font:inherit;color:var(--ink);border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 8px}
button{cursor:pointer}
button:hover{background:var(--bg)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.cw{position:relative;margin-top:10px}
.sel{display:flex;gap:8px;align-items:center;margin-top:6px}
.sel select{flex:1}
.ctl{position:absolute;top:10px;left:10px;display:flex;gap:6px;z-index:2}
.ctl button{box-shadow:0 1px 3px #0003}
.ctl button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#legend{position:absolute;left:10px;bottom:28px;z-index:2;background:#fffffff2;border-radius:8px;padding:10px 12px;box-shadow:0 1px 4px #0003;min-width:190px}
#legend h3{margin:0 0 6px;font-size:12px}
#legend button{display:flex;align-items:center;gap:8px;width:100%;border:0;padding:3px 2px;text-align:left;background:none;font-size:12px}
#legend i{width:16px;height:12px;border-radius:2px;flex:none}
#legend em{margin-left:auto;font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums}
#legend button.off{opacity:.4}
.maplibregl-popup-content{font:13px/1.4 "Schibsted Grotesk",sans-serif;padding:12px 14px;border-radius:8px}
.maplibregl-popup-content h3{margin:0;font-size:16px}
.maplibregl-popup-content p{margin:0 0 6px;color:var(--mute)}
.maplibregl-popup-content dl{display:grid;grid-template-columns:1fr auto;gap:2px 14px;margin:0}
.maplibregl-popup-content dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:60vh auto;height:auto}aside{border:0}body,html{height:auto}}
</style>
</head>
<body>
<div id="app">
<div id="mapwrap">
  <div class="ctl"><button id="bLight" class="on">Light</button><button id="bSat">Satellite</button></div>
  <div id="map"></div>
  <div id="legend"></div>
</div>
<aside>
  <h1>Cooling priority in Abuja</h1>
  <p id="intro"></p>
  <div class="kpis">
    <div><b id="k1"></b><span>wards shown</span></div>
    <div><b id="k2"></b><span>mean index</span></div>
    <div><b id="k3"></b><span id="k3s"></span></div>
  </div>
  <div class="row">
    <label>Area council<select id="lga"><option value="">All area councils</option></select></label>
    <label>Classes<select id="method"></select></label>
    <label>Find a ward<input id="find" list="wl" placeholder="Type a ward name"></label>
    <datalist id="wl"></datalist>
  </div>
  <div class="row" style="margin-top:10px"><button id="reset">Reset filters</button></div>
  <section><h2>Wards by priority class</h2><p>Click a bar to filter the map.</p><div class="cw" style="height:190px"><canvas id="c1"></canvas></div></section>
  <section><h2>Ten highest-priority wards</h2><p>Click a bar to zoom to the ward.</p><div class="cw" style="height:300px"><canvas id="c2"></canvas></div></section>
  <section><h2>Class mix by area council</h2><p>Councils are ordered by mean index. Click a bar to filter.</p><div class="cw" style="height:230px"><canvas id="c3"></canvas></div></section>
  <section><h2>Index against another field</h2>
    <div class="sel"><select id="x"></select></div>
    <div class="cw" style="height:270px"><canvas id="c4"></canvas></div></section>
</aside>
</div>

  $('#k3').textContent=top.length?P(top[0]).ward:'–';
  $('#k3s').textContent=top.length?`highest priority, index ${P(top[0]).INDEX_.toFixed(3)}`:'highest priority';
  $('#legend').innerHTML='<h3>Cooling priority</h3>'+m.k.map((k,i)=>`<button data-k="${k}" class="${S.cls.size&&!S.cls.has(k)?'off':''}"><i style="background:${m.c[i]}"></i>${m.l[i]}<em>${inL.filter(f=>P(f)[S.m]===k).length}</em></button>`).join('');
  document.querySelectorAll('#legend button').forEach(b=>b.onclick=()=>togCls(+b.dataset.k));
  const dim=(c,off)=>off?c+'55':c, sel=f=>P(f).OBJECTID===S.sel;

  mk('c1',{type:'bar',data:{labels:m.l,datasets:[{data:m.k.map(k=>inL.filter(f=>P(f)[S.m]===k).length),backgroundColor:m.c.map((c,i)=>dim(c,S.cls.size&&!S.cls.has(m.k[i])))}]},
    options:{plugins:{legend:{display:false}},scales:{y:{ticks:{precision:0},grid:GRID},x:{grid:{display:false}}},onClick:(e,a)=>a.length&&togCls(m.k[a[0].index])}});

  const T=top.slice(0,10);
  mk('c2',{type:'bar',data:{labels:T.map(f=>P(f).ward),datasets:[{data:T.map(f=>P(f).INDEX_),backgroundColor:T.map(color),borderColor:'#14252b',borderWidth:T.map(f=>sel(f)?2:0)}]},
    options:{indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{afterLabel:i=>P(T[i.dataIndex]).lga}}},scales:{x:{min:0,grid:GRID},y:{grid:{display:false}}},onClick:(e,a)=>a.length&&pick(T[a[0].index],true)}});

  mk('c3',{type:'bar',data:{labels:lgas,datasets:m.k.map((k,i)=>({label:m.l[i],data:lgas.map(l=>D.features.filter(f=>P(f).lga===l&&P(f)[S.m]===k).length),backgroundColor:lgas.map(l=>dim(m.c[i],S.lga&&S.lga!==l))}))},
    options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{stacked:true,ticks:{precision:0},grid:GRID},y:{stacked:true,grid:{display:false}}},onClick:(e,a)=>a.length&&togLga(lgas[a[0].index])}});

  mk('c4',{type:'scatter',data:{datasets:[{data:V.map(f=>({x:P(f)[S.x],y:P(f).INDEX_})),backgroundColor:V.map(color),pointRadius:V.map(f=>sel(f)?8:4.5),borderColor:'#14252b',borderWidth:V.map(f=>sel(f)?2:0)}]},
    options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:i=>`${P(V[i.dataIndex]).ward}: ${i.parsed.x}, ${i.parsed.y}`}}},
      scales:{x:{type:S.x==='sum_POPDENS_CY'?'logarithmic':'linear',title:{display:true,text:F[S.x]+(S.x==='sum_POPDENS_CY'?' (log scale)':'')},grid:GRID},y:{title:{display:true,text:'Cooling Priority Index'},grid:GRID}},
      onClick:(e,a)=>a.length&&pick(V[a[0].index],true)}});
  paint();
}

// ---- controls
$('#intro').textContent=`${N} wards in the FCT ranked by Cooling Priority Index. Higher values mean cooling is needed more urgently.`;
lgas.forEach(l=>$('#lga').add(new Option(l,l)));
Object.keys(METHODS).forEach(k=>$('#method').add(new Option(METHODS[k].n,k)));
Object.keys(F).forEach(k=>$('#x').add(new Option(F[k],k)));
$('#wl').innerHTML=D.features.map(f=>`<option value="${P(f).ward}">`).join('');
$('#lga').onchange=e=>{S.lga=e.target.value||null;fit(D.features.filter(vis));render()};
$('#method').onchange=e=>{S.m=e.target.value;S.cls.clear();render()};
$('#x').onchange=e=>{S.x=e.target.value;render()};
$('#find').onchange=e=>{const f=D.features.find(f=>P(f).ward.toLowerCase()===e.target.value.trim().toLowerCase());if(f){pick(f,true);e.target.value=''}};
$('#reset').onclick=()=>{S.cls.clear();S.lga=null;S.sel=null;pop?.remove();$('#lga').value='';fit(D.features,20);render()};
render();
</script>
</body>
</html>
